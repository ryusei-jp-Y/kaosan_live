name: Secret Scan

# PR / main push で作業ツリーに API キーや秘密鍵が混入していないか検査する。
# gitleaks の公式 Action は組織アカウントだとライセンスキーを要求するため、
# ライセンス不要な gitleaks バイナリを直接ダウンロードして実行している（どのリポジトリにも流用可）。

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # --no-git: 履歴ではなく現在の作業ツリーを走査（決定的・高速）
          # --redact: ログに秘密情報の実値を残さない
          ./gitleaks detect --no-git --source . --redact --verbose
