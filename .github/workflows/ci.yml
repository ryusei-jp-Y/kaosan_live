name: CI

on:
  pull_request:
  push:
    branches:
      - main

# 同一ブランチで新しい push があれば進行中の古いランを打ち切る（Actions 分の節約）。
# main は打ち切らない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build (renderer)
        run: npm run build
